name: russkie-bliny-demo
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bliny
      POSTGRES_USER: bliny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bliny-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bliny -d bliny"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment: &app-env
      APP_MODE: demo
      DATABASE_URL: postgresql+psycopg://bliny:${POSTGRES_PASSWORD:-bliny-local-demo}@db:5432/bliny
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Bliny-demo-2026!}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    build: .
    command: ["python", "-m", "backend.app.worker"]
    environment: *app-env
    volumes:
      - app_data:/app/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
