[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-blini-demo"
version = "0.1.0"
description = "Учебный прототип прогноза спроса и управления запасами"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<2.4", "matplotlib>=3.9,<4", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "jupyterlab>=4.3,<5"]

[project.scripts]
blini = "blini.cli:main"
blini-desktop = "blini.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
