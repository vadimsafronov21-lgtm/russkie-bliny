name: web-app checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: web-app
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: bliny
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bliny_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bliny -d bliny_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: ruff check backend tests
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bliny:test-only@localhost:5432/bliny_test
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://bliny:test-only@localhost:5432/bliny_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web-app/frontend
